{{- /* chezmoi:modify-template */ -}}
{{- /* Enforce only these keys; everything Codex writes itself (trust entries, app state) is kept. */ -}}
{{- $c := dict -}}
{{- if .chezmoi.stdin }}{{ $c = fromToml .chezmoi.stdin }}{{ end -}}
{{- $c = setValueAtPath "model" "gpt-6.1-sol" $c -}}
{{- $c = setValueAtPath "model_reasoning_effort" "medium" $c -}}
{{- $c = setValueAtPath "features.multi_agent" true $c -}}
{{- $c = setValueAtPath "features.memories" true $c -}}
{{- $c = setValueAtPath "memories.generate_memories" true $c -}}
{{- $c = setValueAtPath "memories.use_memories" true $c -}}
{{- $c = setValueAtPath "tui.status_line" (list "model-with-reasoning" "git-branch" "pull-request-number" "branch-changes" "context-used" "context-window-size" "fast-mode" "estimated-thread-cost" "project-name" "five-hour-limit" "weekly-limit") $c -}}
{{- $c = setValueAtPath "tui.status_line_use_colors" true $c -}}
{{- $c = setValueAtPath "mcp_servers.openaiDeveloperDocs.url" "https://developers.openai.com/mcp" $c -}}
{{- toToml $c -}}

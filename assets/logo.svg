<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2733"/>
      <stop offset="1" stop-color="#10151d"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7a8"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#10151d"/>
    </marker>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- terminal window -->
  <rect x="92" y="164" width="328" height="224" rx="30" fill="url(#card)"/>
  <g fill="#1e2633">
    <circle cx="130" cy="200" r="10"/>
    <circle cx="160" cy="200" r="10"/>
    <circle cx="190" cy="200" r="10"/>
  </g>
  <rect x="92" y="226" width="328" height="6" fill="#1e2633" opacity="0.18"/>

  <!-- prompt: ❯ _ -->
  <polyline points="146,262 196,298 146,334" fill="none" stroke="#1e2633" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="226" y="318" width="86" height="26" rx="13" fill="#1e2633"/>

  <!-- sync badge -->
  <circle cx="404" cy="152" r="62" fill="#10151d"/>
  <circle cx="404" cy="152" r="46" fill="#38bdf8"/>
  <g fill="none" stroke="#10151d" stroke-width="9" stroke-linecap="round">
    <path d="M382.3 144.5 A23 23 0 0 1 424.0 140.5" marker-end="url(#head)"/>
    <path d="M425.7 159.5 A23 23 0 0 1 384.0 163.5" marker-end="url(#head)"/>
  </g>
</svg>

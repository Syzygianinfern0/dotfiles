<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2733"/>
      <stop offset="1" stop-color="#10151d"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7a8"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="4" refY="5" markerWidth="2.6" markerHeight="2.6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#10151d"/>
    </marker>
  </defs>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18202b"/>
      <stop offset="1" stop-color="#0b0f15"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#page)"/>
  <circle cx="290" cy="320" r="300" fill="url(#glow)"/>
  <g transform="translate(120 150) scale(0.6640625)"><rect width="512" height="512" rx="112" fill="none" stroke="#334155" stroke-width="3"/>

  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- terminal window -->
  <rect x="92" y="164" width="328" height="224" rx="30" fill="url(#card)"/>
  <g fill="#1e2633">
    <circle cx="130" cy="200" r="10"/>
    <circle cx="160" cy="200" r="10"/>
    <circle cx="190" cy="200" r="10"/>
  </g>
  <rect x="92" y="226" width="328" height="6" fill="#1e2633" opacity="0.18"/>

  <!-- prompt: ❯ _ -->
  <polyline points="146,262 196,298 146,334" fill="none" stroke="#1e2633" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="226" y="318" width="86" height="26" rx="13" fill="#1e2633"/>

  <!-- sync badge -->
  <circle cx="404" cy="152" r="62" fill="#10151d"/>
  <circle cx="404" cy="152" r="46" fill="#38bdf8"/>
  <g fill="none" stroke="#10151d" stroke-width="9" stroke-linecap="round">
    <path d="M382.3 144.5 A23 23 0 0 1 424.0 140.5" marker-end="url(#head)"/>
    <path d="M425.7 159.5 A23 23 0 0 1 384.0 163.5" marker-end="url(#head)"/>
  </g>
</g>

  <text x="540" y="282" font-family="Helvetica Neue" font-weight="700" font-size="118" fill="#f1f5f9" letter-spacing="-2">dotfiles</text>
  <text x="544" y="346" font-family="Helvetica Neue" font-size="32" fill="#94a3b8">One small, fast zsh setup for every machine:</text>
  <text x="544" y="390" font-family="Helvetica Neue" font-size="32" fill="#94a3b8">Mac, Linux, or a cluster without sudo.</text>

  <rect x="540" y="430" width="660" height="64" rx="14" fill="#0b0f15" stroke="#263241" stroke-width="2"/>
  <text x="566" y="472" font-family="JetBrains Mono" font-weight="700" font-size="26" fill="#4ade80">&gt;</text>
  <text x="596" y="472" font-family="JetBrains Mono" font-size="26" fill="#e2e8f0">chezmoi init --apply Syzygianinfern0</text>

  <text x="544" y="548" font-family="JetBrains Mono" font-size="22" fill="#64748b">zsh · starship · fzf · zoxide · ghostty · chezmoi</text>
</svg>

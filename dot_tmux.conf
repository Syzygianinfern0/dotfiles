# tmux-256color where its terminfo exists (old hosts may lack it).
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'
# True color passthrough (Tc form works on old tmux too, unlike terminal-features).
set -as terminal-overrides ',*:Tc'
# Login shell is bash on some network accounts: still start zsh in panes.
if-shell 'case "$SHELL" in *zsh) exit 1;; esac; command -v zsh >/dev/null' \
  'set -g default-command "exec zsh -l"'
set -g mouse on                      # scroll, select panes, resize with mouse
set -g base-index 1                  # windows/panes start at 1 (matches keyboard)
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 10               # snappy Esc (no lag in editors)
set -g history-limit 50000
set -g focus-events on

bind-key -n S-Left swap-window -d -t -1
bind-key -n S-Right swap-window -d -t +1

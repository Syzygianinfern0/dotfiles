# ~/.config/starship.toml — clean two-line prompt
# Docs: https://starship.rs/config/   Presets: https://starship.rs/presets/

# Blank line before each prompt, and a clear input arrow on its own line.
add_newline = true

format = """
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$golang\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"

[hostname]
ssh_only = true              # show only when connected over SSH
format = "[$hostname]($style) "
style = "bold green"

[directory]
truncation_length = 0        # 0 = no truncation; show the full path
truncate_to_repo = false     # don't cut the path down to the git repo root
style = "bold cyan"
read_only = " 󰌾"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold yellow"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
modified = "!${count}"
staged = "+${count}"
stashed = "\\$${count}"
deleted = "✘${count}"

# Show how long the last command took, if it was slow.
[cmd_duration]
min_time = 2000
format = "took [$duration]($style) "
style = "bold yellow"

# Language versions: only shown when relevant files are present in the dir.
[nodejs]
symbol = " "
format = "[$symbol($version )]($style)"

[python]
symbol = " "
format = '[$symbol($version )(\($virtualenv\) )]($style)'

[golang]
symbol = " "
format = "[$symbol($version )]($style)"
